name: Deploy API image to ECR

on:
  push:
    branches:
      - develop
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets[github.ref_name == 'main' && 'AWS_ROLE_ARN_PRD' || 'AWS_ROLE_ARN_STG'] }}
  ECR_REPOSITORY: ${{ vars[github.ref_name == 'main' && 'ECR_API_REPOSITORY_PRD' || 'ECR_API_REPOSITORY_STG'] }}
  API_LAMBDA_FUNCTION_NAME: kyo8-portfolio-api-${{ github.ref_name == 'main' && 'prd' || 'stg' }}
  BATCH_LAMBDA_FUNCTION_NAME: kyo8-portfolio-batch-${{ github.ref_name == 'main' && 'prd' || 'stg' }}

jobs:
  deploy:
    name: Build and push Lambda image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}

      - name: Update api Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "${API_LAMBDA_FUNCTION_NAME}" \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}" \
            --region "${AWS_REGION}"

      - name: Update batch Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "${BATCH_LAMBDA_FUNCTION_NAME}" \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}" \
            --architectures arm64 \
            --region "${AWS_REGION}"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name "${API_LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}"

      - name: Wait for batch Lambda update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name "${BATCH_LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}"
